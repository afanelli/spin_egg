<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Pokémon Precedente</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input { padding: 8px; width: 80px; }
    button { padding: 8px 12px; margin-left: 8px; }
    img { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Trova il Pokémon precedente</h1>
  <p>Inserisci un ID (1–721):</p>
  <input id="pokemonId" type="number" min="1" max="721" placeholder="ID">
  <button onclick="trovaPrecedente()">Cerca</button>
  
  <div id="risultato" style="margin-top:20px;"></div>
  
  <script>
    async function trovaPrecedente() {
      const id = parseInt(document.getElementById("pokemonId").value);
      const risultatoDiv = document.getElementById("risultato");

      if (isNaN(id) || id < 1 || id > 721) {
        risultatoDiv.innerHTML = "Inserisci un ID valido (1–721)";
        return;
      }

      // Se è Bulbasaur (#1), torna all'ultimo (#721)
      const prevId = (id === 1) ? 721 : id - 1;

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${prevId}`);
        if (!response.ok) throw new Error("Errore nella richiesta");
        const data = await response.json();

        risultatoDiv.innerHTML = `
          <h2>Pokémon precedente:</h2>
          <h3>#${data.id} ${data.name.toUpperCase()}</h3>
          <img src="${data.sprites.front_default}" alt="${data.name}">
        `;
      } catch (error) {
        risultatoDiv.innerHTML = "Impossibile recuperare il Pokémon.";
      }
    }
  </script>
</body>
</html>
