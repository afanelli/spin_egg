<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Spin Egg Helper</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 40px 10px; background-color: #1e1e1e; color: #e0e0e0; }
    input { padding: 8px; border-radius: 4px; border: 1px solid #555; background-color: #2c2c2c; color: #e0e0e0; width: 100%; box-sizing: border-box; }
    .result-container { display: flex; justify-content: center; align-items: flex-start; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .pokemon-block { flex: 1 1 180px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; margin: 10px; padding: 12px; background-color: #2a2a2a; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,.5); min-height: 130px; max-width: 200px; }
    .pokemon-block-arceus { flex: 1 1 180px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; margin: 10px; padding: 12px; background-color: #2a2a2a; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,.5); }
    .pokemon-block h2 { font-size: 14px; margin: 5px 0 8px 0; color: #9ecbff; height: 32px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .pokemon-block h3 { font-size: 15px; margin-top: 8px; color: #fff; text-align: center; min-height: 38px; }
    .pokemon-block img { width: 90px; height: 90px; margin: 8px 0; }
    .pokemon-block h3 { margin-top: 8px; margin-bottom: 4px; font-size: 1.2rem; }
    img { width: 100%; height: auto; max-width: 120px; margin-top: 10px; }
    .suggestion { cursor: pointer; color: #4fa3ff; text-decoration: underline; }
    .suggestion:hover { color: #82c7ff; }
    table { border-collapse: collapse; margin: 20px auto; width: 80%; max-width: 900px; background-color: #2a2a2a; border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,.5); }
    th, td { border: 1px solid #444; padding: 8px 10px; text-align: center; }
    th { background-color: #333; color: #fff; }
    tr:hover { background-color: #3b3b3b; }
    h1 { color: #4fa3ff; }
    .bst-title { color: #4fa3ff; margin-bottom: 5px; font-size: 24px; }
    .bst-subtitle { color: #4fa3ff; margin-bottom: 15px; font-size: 16px; }
    .work-progress { color: #f5c542; font-style: italic; font-weight: 600; background-color: rgba(245,197,66,0.1); padding: 2px 6px; border-radius: 6px; }
    header { margin-bottom: 20px; }
    #bstTableDiv { width: 100%; overflow-x: auto; }
    #suggestions, #suggestionsNext { max-height: 150px; overflow-y: auto; border-radius: 4px; position: absolute; top: 100%; left: 0; right: 0; background-color: #2a2a2a; border: 1px solid #555; z-index: 1000; display: none; box-sizing: border-box; }
    #suggestions div, #suggestionsNext div { padding: 6px 8px; cursor: pointer; color: #e0e0e0; }
    #suggestions div:hover, #suggestionsNext div:hover { background-color: #0078d4; }
    hr { border: 0; height: 1px; background: #444; margin: 30px 0; }
    @media (max-width: 600px) {
      body { font-size: 16px; margin: 20px 10px; }
      input { width: 90%; font-size: 16px; padding: 10px; }
      .pokemon-block { width: 85%; display: block; margin: 15px auto; padding: 12px; max-width: none; }
      .pokemon-block img { max-width: 100px; }
      h2 { font-size: 18px; margin: 6px 0; }
      h3 { font-size: 16px; margin: 4px 0; }
      table { width: 100%; font-size: 14px; }
      svg { width: 40px; height: 40px; }
    }
  </style>       
</head>
<body>
  <header>
    <h1>Spin Egg Helper</h1>
  </header>

  <p>Inserisci il nome di un Pokémon per sapere quale verrà schiuso dallo spin egg:</p>
  <div style="position: relative; display: inline-block; width: 200px;">
    <input id="pokemonNameInput" type="text" placeholder="Nome Pokémon" autocomplete="off">
    <div id="suggestions"></div>
  </div>

  <div id="arceusNote"></div>
  <div id="resultDiv" style="margin-top:20px;"></div>

  <p style="margin-top:40px;">Inserisci il pokemon che vuoi che sia schiuso dallo spin egg per sapere quale devi catturare:</p>
  <div style="position: relative; display: inline-block; width: 200px;">
    <input id="pokemonNextInput" type="text" placeholder="Nome Pokémon" autocomplete="off">
    <div id="suggestionsNext"></div>
  </div>

  <div id="nextNote"></div>
  <div id="resultNextDiv" style="margin-top:20px;"></div>

  <hr>

  <div id="bstTitleContainer">
    <h2 class="bst-title">Best pokemon list <span class="work-progress">in progress</span></h2>
  </div>

  <div id="bstTableDiv"></div>

  <script>
  const filteredPokemons = [
    {"name":"NINCADA","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/290.png","bst":266,"prevName":"SLAKING","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/289.png","prevBST":670},
    {"name":"BULBASAUR","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png","bst":318,"prevName":"VOLCANION","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/721.png","prevBST":600},
    {"name":"CHIKORITA","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/152.png","bst":318,"prevName":"MEW","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/151.png","prevBST":600},
    {"name":"TREECKO","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/252.png","bst":310,"prevName":"CELEBI","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/251.png","prevBST":600},
    {"name":"BELDUM","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/374.png","bst":300,"prevName":"SALAMENCE","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/373.png","prevBST":600},
    {"name":"TURTWIG","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/387.png","bst":318,"prevName":"DEOXYS-NORMAL","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/386.png","prevBST":600},
    {"name":"MUNCHLAX","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/446.png","bst":390,"prevName":"GARCHOMP","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/445.png","prevBST":600},
    {"name":"SNIVY","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/495.png","bst":308,"prevName":"VICTINI","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/494.png","prevBST":600},
    {"name":"LARVESTA","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/636.png","bst":360,"prevName":"HYDREIGON","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/635.png","prevBST":600},
    {"name":"CHESPIN","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/650.png","bst":313,"prevName":"GENESECT","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/649.png","prevBST":600},
    {"name":"KLEFKI","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/707.png","bst":470,"prevName":"GOODRA","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/706.png","prevBST":600},
    {"name":"DRATINI","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/147.png","bst":300,"prevName":"MOLTRES","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/146.png","prevBST":580},
    {"name":"LARVITAR","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/246.png","bst":300,"prevName":"SUICUNE","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/245.png","prevBST":580},
    {"name":"PHIONE","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/489.png","bst":480,"prevName":"CRESSELIA","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/488.png","prevBST":580},
    {"name":"TRUBBISH","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/568.png","bst":300,"prevName":"ARCHEOPS","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/567.png","prevBST":567},
   //{"name":"POLIWAG","image":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/60.png","bst":300,"prevName":"ARCANINE","prevImage":"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/59.png","prevBST":555}
];

  let allPokemonNames = [];
  const pokemonAlias = {
    "deoxys": "deoxys-normal",
    "wormadam": "wormadam-plant",
    "aegislash": "aegislash-shield",
    "basculin": "basculin-red-striped",
    "giratina": "giratina-altered",
    "shaymin": "shaymin-land",
    "tornadus": "tornadus-incarnate",
    "thundurus": "thundurus-incarnate",
    "landorus": "landorus-incarnate",
    "keldeo": "keldeo-ordinary",
    "meloetta": "meloetta-aria",
    "meowstic": "meowstic-male",
    "pumpkaboo": "pumpkaboo-average",
    "gourgeist": "gourgeist-average"
  };

  async function loadAllPokemonNames(){
    const generations=[1,2,3,4,5,6];
    const allSpecies=[];
    for(const gen of generations) {
      const res=await fetch(`https://pokeapi.co/api/v2/generation/${gen}/`);
      const data=await res.json();
      allSpecies.push(...data.pokemon_species.map(p=>p.name));
    }
    allPokemonNames=allSpecies.sort();
  }
  loadAllPokemonNames();

  const suggestionsDiv=document.getElementById("suggestions");
  document.getElementById("pokemonNameInput").addEventListener("input",function(){ showSuggestions(this.value,"previous"); });
  const suggestionsNextDiv=document.getElementById("suggestionsNext");
  document.getElementById("pokemonNextInput").addEventListener("input",function(){ showSuggestions(this.value,"next"); });

  function showSuggestions(inputVal,mode) {
    const suggestionsBox = mode==="previous"?suggestionsDiv:suggestionsNextDiv;
    if(!inputVal.trim()){ suggestionsBox.style.display="none"; return; }
    const matched = allPokemonNames.filter(name => name.startsWith(inputVal.toLowerCase()) && !name.includes("-mega") && !name.includes("-gmax")).slice(0,10);
    if(matched.length===0){ suggestionsBox.style.display="none"; return; }
    suggestionsBox.innerHTML = matched.map(n => `<div onclick="selectSuggestion('${n}','${mode}')">${n}</div>`).join("");
    suggestionsBox.style.display="block";
  }

  function selectSuggestion(name,mode) {
    if(mode==="previous") { 
      document.getElementById("pokemonNameInput").value=name; 
      suggestionsDiv.style.display="none"; 
      findPrevious(name); 
    }
    else { 
      document.getElementById("pokemonNextInput").value=name; 
      suggestionsNextDiv.style.display="none"; 
      findNext(name); 
    }
  }

  document.addEventListener("click",function(e) {
    if(!document.getElementById("pokemonNameInput").contains(e.target)&&!suggestionsDiv.contains(e.target)) { 
      suggestionsDiv.style.display="none"; 
    }
    if(!document.getElementById("pokemonNextInput").contains(e.target)&&!suggestionsNextDiv.contains(e.target)) { 
      suggestionsNextDiv.style.display="none"; 
    }
  });

  async function findPrevious(nameOverride) {
    const pokemonName=(nameOverride||document.getElementById("pokemonNameInput").value).trim().toLowerCase();
    const result=document.getElementById("resultDiv");
    const arceusNoteDiv=document.getElementById("arceusNote");
    arceusNoteDiv.innerHTML="";
    if(!pokemonName) { 
      result.innerHTML="Inserisci un nome Pokémon valido!"; 
      return; 
    }

    try {
      const fetchName=pokemonAlias[pokemonName]||pokemonName;
      const response=await fetch(`https://pokeapi.co/api/v2/pokemon/${fetchName}`);
      if(!response.ok) {
        throw new Error("Pokémon non trovato");
      }
      const data=await response.json();
      let previousId=data.id===1?721:data.id-1;
      let prevResponse=await fetch(`https://pokeapi.co/api/v2/pokemon/${previousId}`);
      let prevData=await prevResponse.json();
      if(prevData.name.toLowerCase()==="arceus") { 
        arceusNoteDiv.innerHTML="<div class='pokemon-block-arceus' style='background-color:#3a3a3a;'>Il Pokémon precedente sarebbe Arceus, ma non è selezionabile.</div>"; 
        previousId--; 
        prevResponse=await fetch(`https://pokeapi.co/api/v2/pokemon/${previousId}`); 
        prevData=await prevResponse.json(); 
      }
      result.innerHTML = `
      <div class="result-container">
        <div class="pokemon-block">
          <h2>Pokémon posseduto:</h2>
          <img src="${data.sprites.front_default}" alt="${data.name}">
          <h3>#${data.id} ${data.name.toUpperCase()}</h3>
          <h2>${data.stats.reduce((acc, s) => acc + s.base_stat, 0)} BST</h2>
        </div>
        <div class="pokemon-block">
          <h2>Pokémon che uscirà dallo spin egg:</h2>
          <img src="${prevData.sprites.front_default}" alt="${prevData.name}">
          <h3>#${prevData.id} ${prevData.name.toUpperCase()}</h3>
          <h2>${prevData.stats.reduce((acc, s) => acc + s.base_stat, 0)} BST</h2>
        </div>
      </div>`;
    } catch { 
      result.innerHTML="Errore nella ricerca."; 
    }
  }

  async function findNext(nameOverride){
    const pokemonName=(nameOverride||document.getElementById("pokemonNextInput").value).trim().toLowerCase();
    const result=document.getElementById("resultNextDiv");
    const nextNote=document.getElementById("nextNote");
    nextNote.innerHTML="";
    if(!pokemonName) { 
      result.innerHTML="Inserisci un nome Pokémon valido!"; return;
    }

    try {
      const fetchName=pokemonAlias[pokemonName]||pokemonName;
      const response=await fetch(`https://pokeapi.co/api/v2/pokemon/${fetchName}`);
      const data=await response.json();
      if(data.id===493) { 
        nextNote.innerHTML="<div class='pokemon-block' style='background-color:#3a3a3a;'>Pokémon non selezionabile</div>"; 
        result.innerHTML=""; return; 
      }
      let nextId=data.id===721?1:data.id+1;
      let nextResponse=await fetch(`https://pokeapi.co/api/v2/pokemon/${nextId}`);
      let nextData=await nextResponse.json();
      result.innerHTML = `
      <div class="result-container">
        <div class="pokemon-block">
          <h2>Pokémon che vuoi far uscire dallo Spin egg:</h2>
          <img src="${data.sprites.front_default}" alt="${data.name}">
          <h3>#${data.id} ${data.name.toUpperCase()}</h3>
          <h2>${data.stats.reduce((acc, s) => acc + s.base_stat, 0)} BST</h2>
        </div>
        <div class="pokemon-block">
          <h2>Pokémon che devi catturare:</h2>
          <img src="${nextData.sprites.front_default}" alt="${nextData.name}">
          <h3>#${nextData.id} ${nextData.name.toUpperCase()}</h3>
          <h2>${nextData.stats.reduce((acc, s) => acc + s.base_stat, 0)} BST</h2>
        </div>
      </div>`;

    } catch { 
      result.innerHTML="Errore nella ricerca."; 
    }
  }

  function showBSTTable() {
    const tableDiv=document.getElementById("bstTableDiv");
    if(!filteredPokemons||filteredPokemons.length===0){ tableDiv.innerHTML="Nessun Pokémon disponibile!"; return; }
    let html=`<table><tr><th>Pokémon</th><th>img</th><th>BST</th><th>Precedente</th><th>img</th><th>BST</th></tr>`;
    filteredPokemons.forEach(p=>{ html+=`<tr><td>${p.name}</td><td><img src="${p.image}" alt="${p.name}" width="64"></td><td>${p.bst}</td><td>${p.prevName}</td><td><img src="${p.prevImage}" alt="${p.prevName}" width="64"></td><td>${p.prevBST}</td></tr>`; });
    html+=`</table>`; tableDiv.innerHTML=html;
  }
  showBSTTable();
  </script>
</body>
</html>
